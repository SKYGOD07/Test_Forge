[project]
name = "campuspulse-ai-backend"
version = "0.1.0"
description = "CampusPulse AI - AI-powered campus information assistant using Gemma 4"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "CampusPulse AI Team" }
]

dependencies = [
    # Core Web Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # Gemma 4 & Google Gen AI SDK
    "google-genai>=2.31.0",
    
    # LLM Compatibility Layer
    "openai>=1.0.0",
    
    # Zep Cloud (Simulation Knowledge Graph)
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    
    # Simulation Framework
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # Document & File Processing
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    "pillow>=10.0.0",
    
    # Utilities & Validation
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
