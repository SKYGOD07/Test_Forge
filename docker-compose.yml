services:
  campuspulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: campuspulse-ai:local
    container_name: campuspulse
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_DEBUG: "false"
    ports:
      - "3000:3000"
    expose:
      - "3000"
      - "5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
